name: Build Mesen

# Gauntlet Edition builds only for Windows, and only on demand (or when a
# version tag is pushed) - the upstream matrix built 15 jobs across Windows,
# Linux and macOS on every single push, which burns through the Actions quota.
# Run it from the Actions tab ("Run workflow") when you want a release binary.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  windows:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Restore packages
        run: dotnet restore -p:TargetFramework="net8.0" -r win-x64 -p:PublishAot="false" -p:BuildWithNetFrameworkHostedCompiler=true

      - name: Write commit SHA1 to file
        uses: ./.github/actions/build-sha1-action

      - name: Build Mesen
        run: msbuild -nologo -v:d -clp:ForceConsoleColor -m -p:Configuration=Release -p:Platform=x64 -t:Clean,UI -p:TargetFramework="net8.0"

      - name: Publish Mesen
        run: dotnet publish --no-restore -c Release -p:PublishAot="false" -p:SelfContained="false" -p:PublishSingleFile="true" -p:OptimizeUi="true" -p:Platform="Any CPU" -p:TargetFramework="net8.0" -r win-x64 Mesen.sln /p:PublishProfile=UI\Properties\PublishProfiles\Release.pubxml

      - name: Upload Mesen
        uses: actions/upload-artifact@v7
        with:
          name: Mesen (Windows - net8.0)
          path: |
            build/TmpReleaseBuild/Mesen.exe
